<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frise Chronologique — Live TikTok</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0f1d, #1a0510);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.4rem;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        .subtitle {
            color: #00ccff;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 20, 30, 0.9);
            border: 2px solid #334;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #445;
            padding-bottom: 8px;
        }
        .round-indicator {
            font-size: 1rem;
            font-weight: bold;
            color: #ff9900;
        }
        .universe-tag {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .tag-marvel { background-color: #ff3333; color: white; }
        .tag-dc { background-color: #3366ff; color: white; }
        .tag-arrowverse { background-color: #00aa55; color: white; }

        .question-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffdf7f;
            text-align: center;
        }
        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .slot-row {
            display: flex;
            align-items: center;
            background: rgba(10, 10, 18, 0.8);
            border: 2px dashed #556;
            border-radius: 8px;
            min-height: 50px;
            padding: 5px 10px;
            transition: 0.2s;
        }
        .slot-row.drag-over {
            border-color: #00ccff;
            background: rgba(0, 204, 255, 0.1);
        }
        .slot-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00ccff;
            width: 30px;
            text-align: center;
        }
        .slot-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 40px;
            align-items: center;
        }
        .pool-box {
            background: rgba(15, 15, 25, 0.9);
            border: 1px solid #445;
            border-radius: 8px;
            padding: 10px;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .event-card {
            padding: 8px 12px;
            background-color: #2a344a;
            color: white;
            border: 1px solid #557799;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s;
        }
        .event-card:active {
            cursor: grabbing;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-validate {
            background-color: #28a745;
            color: white;
        }
        .btn-validate:hover { background-color: #218838; }
        .btn-reset {
            background-color: #dc3545;
            color: white;
        }
        .btn-reset:hover { background-color: #c82333; }
        .btn-next {
            background-color: #007bff;
            color: white;
            display: none;
        }
        .btn-next:hover { background-color: #0056b3; }
        .feedback {
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            min-height: 24px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

    <h1>Frise Chronologique Ultime</h1>
    <div class="subtitle">Remettez les événements dans le bon ordre avec le chat !</div>

    <div class="game-container">
        <div class="header-game">
            <div class="round-indicator" id="roundIndicator">Manche 1 / 12</div>
            <div class="universe-tag" id="universeTag">Marvel</div>
        </div>

        <div class="question-title" id="questionTitle">Chargement...</div>

        <div class="slots-container" id="slotsContainer">
            <!-- Généré en JS -->
        </div>

        <div class="pool-box" id="poolBox" ondragover="allowDrop(event)" ondragleave="unhighlight(event)" ondragenter="highlight(event)" ondrop="dropToPool(event)">
            <!-- Événements à placer -->
        </div>

        <div class="controls">
            <button class="btn btn-reset" onclick="resetCurrentRound()">Réinitialiser</button>
            <div class="btn-group">
                <button class="btn btn-validate" id="btnValidate" onclick="validateTimeline()">Valider l'ordre</button>
                <button class="btn btn-next" id="btnNext" onclick="nextRound()">Manche suivante ➔</button>
            </div>
        </div>

        <div class="feedback" id="feedbackMsg"></div>
    </div>

    <script>
        const rounds = [
            {
                universe: "marvel",
                title: "L'Ascension et la Chute du MCU (Phase 1-2)",
                events: [
                    { id: 'e1', text: "L'attaque de New York par les Chitauri (Avengers)", order: 1 },
                    { id: 'e2', text: "La destruction du S.H.I.E.L.D. par Hydra (Winter Soldier)", order: 2 },
                    { id: 'e3', text: "L'apparition publique d'Iron Man", order: 0 },
                    { id: 'e4', text: "La création d'Ultron par Tony Stark", order: 3 }
                ]
            },
            {
                universe: "dc",
                title: "Les Origines des Héros (DC Universe)",
                events: [
                    { id: 'e1', text: "La mort des parents de Bruce Wayne dans une ruelle", order: 1 },
                    { id: 'e2', text: "L'arrivée de Kal-El fuyant Krypton sur Terre", order: 0 },
                    { id: 'e3', text: "Diana quitte Themyscira pendant la Grande Guerre", order: 2 },
                    { id: 'e4', text: "Arthur Curry apprend qu'il est l'héritier d'Atlantis", order: 3 }
                ]
            },
            {
                universe: "arrowverse",
                title: "Les Débuts de l'Arrowverse",
                events: [
                    { id: 'e1', text: "Barry Allen se fait frapper par la foudre", order: 1 },
                    { id: 'e2', text: "Oliver Queen rentre de Lian Yu après 5 ans", order: 0 },
                    { id: 'e3', text: "L'invasion extraterrestre des Dominators", order: 2 },
                    { id: 'e4', text: "Le crossover Crisis on Infinite Earths", order: 3 }
                ]
            },
            {
                universe: "marvel",
                title: "La Saga de l'Infini (Apogée)",
                events: [
                    { id: 'e1', text: "Le vol des Pierres d'Infinité dans le passé (Time Heist)", order: 2 },
                    { id: 'e2', text: "Le snap de Thanos qui efface la moitié de l'univers", order: 1 },
                    { id: 'e3', text: "La destruction d'Asgard (Ragnarok)", order: 0 },
                    { id: 'e4', text: "Le sacrifice de Tony Stark contre Thanos", order: 3 }
                ]
            },
            {
                universe: "dc",
                title: "L'Affrontement et la Justice League",
                events: [
                    { id: 'e1', text: "Superman se sacrifie contre Doomsday", order: 0 },
                    { id: 'e2', text: "La résurrection de Superman grâce à la Boîte Mère", order: 1 },
                    { id: 'e3', text: "La bataille finale contre Steppenwolf", order: 2 },
                    { id: 'e4', text: "L'affrontement final contre Darkseid (Snyder Cut)", order: 3 }
                ]
            },
            {
                universe: "arrowverse",
                title: "L'Expansion de Star City et Central City",
                events: [
                    { id: 'e1', text: "La création de l'équipe Flash (S.T.A.R. Labs)", order: 0 },
                    { id: 'e2', text: "L'émergence de Legends of Tomorrow et Rip Hunter", order: 1 },
                    { id: 'e3', text: "La découverte de Supergirl sur une Terre alternative", order: 2 },
                    { id: 'e4', text: "L'introduction de Batwoman à Gotham City", order: 3 }
                ]
            },
            {
                universe: "marvel",
                title: "Le Multivers et le Chaos Récent",
                events: [
                    { id: 'e1', text: "Wanda devient la Sorcière Rouge à Westview", order: 0 },
                    { id: 'e2', text: "Le sort de Strange ouvre les brèches du multivers (No Way Home)", order: 1 },
                    { id: 'e3', text: "Wanda détruit le Darkhold dans le multivers", order: 2 },
                    { id: 'e4', text: "La bataille au bout du temps contre Celui Qui Demeure", order: 3 }
                ]
            },
            {
                universe: "dc",
                title: "Les Adversaires de Gotham & Metropolis",
                events: [
                    { id: 'e1', text: "Le Joker s'associe à Harley Quinn (Suicide Squad)", order: 1 },
                    { id: 'e2', text: "Lex Luthor manipule Batman et Superman", order: 0 },
                    { id: 'e3', text: "Black Manta cherche à se venger d'Aquaman", order: 2 },
                    { id: 'e4', text: "Shazam obtient ses pouvoirs du Conseil des Sorciers", order: 3 }
                ]
            },
            {
                universe: "arrowverse",
                title: "Les Grands Dangers de Central City",
                events: [
                    { id: 'e1', text: "Barry découvre que le Dr. Wells est Reverse-Flash", order: 0 },
                    { id: 'e2', text: "Zoom vole la vitesse de Barry", order: 1 },
                    { id: 'e3', text: "Savitar s'avère être un résidu temporel de Barry", order: 2 },
                    { id: 'e4', text: "Le Thinker (Devoe) exécute son plan d'illumination", order: 3 }
                ]
            },
            {
                universe: "marvel",
                title: "Les Origines Cosmiques",
                events: [
                    { id: 'e1', text: "Peter Quill vole l'Orbe sur Morag", order: 1 },
                    { id: 'e2', text: "Captain Marvel récupère ses pouvoirs des Krees", order: 0 },
                    { id: 'e3', text: "Ego le Vivant révèle son plan machiavélique", order: 2 },
                    { id: 'e4', text: "La création des Gardiens de la Galaxie", order: 3 }
                ]
            },
            {
                universe: "dc",
                title: "L'Ère des Justiciers de Gotham",
                events: [
                    { id: 'e1', text: "Bruce Wayne enfile le costume de Batman", order: 0 },
                    { id: 'e2', text: "Le Joker terrorise Gotham avec le Sphinx et Harley", order: 1 },
                    { id: 'e3', text: "La rédemption de Harley Quinn (Birds of Prey)", order: 2 },
                    { id: 'e4', text: "La traque du tueur The Riddler dans Gotham", order: 3 }
                ]
            },
            {
                universe: "arrowverse",
                title: "Le Crépuscule d'Oliver Queen",
                events: [
                    { id: 'e1', text: "Oliver se rend au FBI et va en prison", order: 0 },
                    { id: 'e2', text: "L'affrontement contre le Neuvième Cercle", order: 1 },
                    { id: 'e3', text: "Oliver accepte le marché du Monitor", order: 2 },
                    { id: 'e4', text: "Le sacrifice ultime d'Oliver pour recréer l'univers", order: 3 }
                ]
            }
        ];

        let currentRound = 0;
        let shuffledEvents = [];

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'pop') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        function loadRound() {
            const data = rounds[currentRound];
            document.getElementById('roundIndicator').textContent = `Manche ${currentRound + 1} / ${rounds.length}`;
            document.getElementById('questionTitle').textContent = data.title;
            
            const tag = document.getElementById('universeTag');
            tag.textContent = data.universe.toUpperCase();
            tag.className = `universe-tag tag-${data.universe}`;

            document.getElementById('feedbackMsg').textContent = '';
            document.getElementById('btnValidate').style.display = 'inline-block';
            document.getElementById('btnNext').style.display = 'none';

            const slotsContainer = document.getElementById('slotsContainer');
            slotsContainer.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                let slot = document.createElement('div');
                slot.className = 'slot-row';
                slot.innerHTML = `
                    <div class="slot-number">${i+1}</div>
                    <div class="slot-content" ondragover="allowDrop(event)" ondragleave="unhighlight(event)" ondragenter="highlight(event)" ondrop="dropToSlot(event, ${i})"></div>
                `;
                slotsContainer.appendChild(slot);
            }

            shuffledEvents = [...data.events].sort(() => Math.random() - 0.5);
            renderPool();
        }

        function renderPool() {
            const pool = document.getElementById('poolBox');
            pool.innerHTML = '';
            shuffledEvents.forEach(ev => {
                let card = document.createElement('div');
                card.className = 'event-card';
                card.draggable = true;
                card.id = ev.id;
                card.textContent = ev.text;
                card.ondragstart = (e) => e.dataTransfer.setData('text', e.target.id);
                pool.appendChild(card);
            });
        }

        function resetCurrentRound() {
            loadRound();
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function highlight(ev) { ev.target.closest('.slot-row, .pool-box')?.classList.add('drag-over'); }
        function unhighlight(ev) { ev.target.closest('.slot-row, .pool-box')?.classList.remove('drag-over'); }

        function dropToSlot(ev, slotIndex) {
            ev.preventDefault();
            document.querySelectorAll('.slot-row, .pool-box').forEach(el => el.classList.remove('drag-over'));
            const id = ev.dataTransfer.getData('text');
            const card = document.getElementById(id);
            const slotContent = ev.currentTarget.closest('.slot-row').querySelector('.slot-content');
            
            if (card) {
                slotContent.innerHTML = '';
                slotContent.appendChild(card);
                playSound('pop');
            }
        }

        function dropToPool(ev) {
            ev.preventDefault();
            document.querySelectorAll('.slot-row, .pool-box').forEach(el => el.classList.remove('drag-over'));
            const id = ev.dataTransfer.getData('text');
            const card = document.getElementById(id);
            if (card) {
                document.getElementById('poolBox').appendChild(card);
                playSound('pop');
            }
        }

        function validateTimeline() {
            const slots = document.querySelectorAll('.slot-content');
            let userOrder = [];
            let complete = true;

            slots.forEach((slot) => {
                const card = slot.querySelector('.event-card');
                if (!card) complete = false;
                else userOrder.push(card.id);
            });

            const feedback = document.getElementById('feedbackMsg');

            if (!complete) {
                feedback.textContent = "Placez tous les événements dans les 4 emplacements !";
                feedback.className = "feedback error";
                playSound('error');
                return;
            }

            const data = rounds[currentRound];
            let correct = true;

            userOrder.forEach((id, index) => {
                const eventObj = data.events.find(e => e.id === id);
                if (eventObj.order !== index) correct = false;
            });

            if (correct) {
                feedback.textContent = "Bien joué ! C'est le bon ordre chronologique ! 🎉";
                feedback.className = "feedback success";
                playSound('success');
                document.getElementById('btnValidate').style.display = 'none';
                if (currentRound < rounds.length - 1) {
                    document.getElementById('btnNext').style.display = 'inline-block';
                }
            } else {
                feedback.textContent = "Mauvais ordre ! Le chat fait fausse route, réessayez ! ❌";
                feedback.className = "feedback error";
                playSound('error');
            }
        }

        function nextRound() {
            currentRound++;
            loadRound();
        }

        window.onload = loadRound;
    </script>
</body>
</html>
